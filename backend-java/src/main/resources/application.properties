spring.application.name=backend-java

# ─── Database: H2 In-Memory (zero-setup, works without PostgreSQL) ─────────────
spring.datasource.url=jdbc:h2:mem:erp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.erp.backend=INFO
logging.level.org.hibernate.SQL=WARN

# JWT Secret (256-bit key for HS256)
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration=86400000

# Disable open-in-view (avoids lazy-load warnings)
spring.jpa.open-in-view=false
